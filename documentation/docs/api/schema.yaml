components:
  schemas:
    AcademicGroupCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        academic_year:
          type: integer
          maximum: 2200
          minimum: 2000
        level:
          $ref: '#/components/schemas/AcademicGroupLevel'
        section:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 2000
      required:
      - academic_year
      - level
      - name
    AcademicGroupLevel:
      enum:
      - early_childhood
      - preschool
      - transition
      - primary_1
      - primary_2
      - primary_3
      - primary_4
      - primary_5
      - secondary_6
      - secondary_7
      - secondary_8
      - secondary_9
      - secondary_10
      - secondary_11
      - technical
      - higher_education
      - continuing_education
      - other
      type: string
      description: |-
        * `early_childhood` - Primera infancia
        * `preschool` - Preescolar
        * `transition` - Transición
        * `primary_1` - Primero
        * `primary_2` - Segundo
        * `primary_3` - Tercero
        * `primary_4` - Cuarto
        * `primary_5` - Quinto
        * `secondary_6` - Sexto
        * `secondary_7` - Séptimo
        * `secondary_8` - Octavo
        * `secondary_9` - Noveno
        * `secondary_10` - Décimo
        * `secondary_11` - Undécimo
        * `technical` - Técnico o tecnológico
        * `higher_education` - Educación superior
        * `continuing_education` - Educación continua
        * `other` - Otro
