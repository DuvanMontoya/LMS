[project]
site_name = "LMS"
site_description = "Documentación oficial de la plataforma académica LMS."
site_url = "https://duvanmontoya.github.io/LMS/"
repo_url = "https://github.com/DuvanMontoya/LMS"
repo_name = "DuvanMontoya/LMS"
edit_uri = "edit/main/documentation/docs/"
copyright = "Copyright &copy; 2026 LMS"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mermaid.min.js",
  "javascripts/mermaid-render.js",
]
nav = [
  { "Inicio" = "index.md" },
  { "Producto" = [
    "producto/index.md",
    "producto/flujos.md",
  ] },
  { "Guías" = [
    "guia-usuario/index.md",
    "guia-administracion/index.md",
  ] },
  { "Desarrollo" = [
    "desarrollo/index.md",
    "desarrollo/frontend.md",
    "desarrollo/backend.md",
  ] },
  { "API" = [
    "api/index.md",
    "api/contrato.md",
  ] },
  { "Arquitectura" = [
    "arquitectura/index.md",
    "base-de-datos/index.md",
    "seguridad/index.md",
  ] },
  { "Pruebas" = "pruebas/index.md" },
  { "Despliegue" = "despliegue/index.md" },
  { "Operación" = "operacion/index.md" },
  { "Solución de problemas" = "solucion-de-problemas/index.md" },
  { "Decisiones arquitectónicas" = "decisiones-arquitectonicas/index.md" },
  { "Contribución" = "contribucion/index.md" },
  { "Referencia" = "referencia/index.md" },
]

[project.theme]
language = "es"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/graduation-cap"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid-source", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
