name: lms

services:
  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8 --data-checksums"
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.8.1-trixie
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning -h 127.0.0.1 -p 6379 ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  livekit:
    profiles: ["live"]
    image: livekit/livekit-server:v1.13.1
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          # Browser clients use the published loopback ports while Egress uses
          # the container-network candidate. Advertising only 127.0.0.1 makes
          # the recorder call itself and can never establish its PeerConnection.
          enable_loopback_candidate: true
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
          db: 4
        webhook:
          api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://host.docker.internal:8010/api/v1/livekit/webhook/}
        prometheus:
          port: 6789
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
      - "127.0.0.1:6789:6789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lms_internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy

  livekit-egress-init:
    profiles: ["live"]
    image: livekit/egress:v1.12.0@sha256:30b3389518c851e6c20e964bba9d5ce89d0bd09b8b0fe0d0d36c9546303c8430
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1001:0 /out && chmod 0770 /out"]
    volumes:
      - livekit_recordings:/out
    network_mode: none
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER

  livekit-egress:
    profiles: ["live"]
    image: livekit/egress:v1.12.0
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
        api_secret: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        ws_url: ws://livekit:7880
        insecure: true
        health_port: 8080
        logging:
          level: info
          json: true
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
          db: 4
        backup_storage: /out
        session_limits:
          file_output_max_duration: 8h
    volumes:
      - livekit_recordings:/out
    expose:
      - "8080"
    depends_on:
      livekit-egress-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - lms_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  assessment-worker:
    profiles: ["async"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      CELERY_BROKER_DB: ${CELERY_BROKER_DB:-2}
      CELERY_WORKER_REMOTE_CONTROL: "true"
      FRONTEND_ORIGIN: http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout=2 2>/dev/null | grep -q pong",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  localstack:
    profiles: ["media"]
    # 4.14.0 is the final supported Community release before auth-token-only
    # image consolidation. See ADR 0025 for the dated operational trade-off.
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      DEBUG: "0"
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - lms_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:4566/_localstack/health | grep -q '\"s3\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  clamav:
    profiles: ["media"]
    image: clamav/clamav:1.5.3_base
    volumes:
      - clamav_definitions:/var/lib/clamav
      - ./infrastructure/media/clamd.conf:/etc/clamav/clamd.conf:ro
    expose:
      - "3310"
    ports:
      - "127.0.0.1:3310:3310"
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=6g,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  media-worker:
    profiles: ["media"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.media-worker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      CELERY_BROKER_DB: ${CELERY_BROKER_DB:-2}
      CELERY_WORKER_REMOTE_CONTROL: "true"
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      ASSET_S3_REGION: us-east-1
      ASSET_S3_INTERNAL_ENDPOINT: http://localstack:4566
      ASSET_S3_PUBLIC_ENDPOINT: http://127.0.0.1:4566
      ASSET_S3_ACCESS_KEY_ID: test
      ASSET_S3_SECRET_ACCESS_KEY: test
      ASSET_S3_FORCE_PATH_STYLE: "true"
      ASSET_QUARANTINE_BUCKET: ${ASSET_QUARANTINE_BUCKET:?ASSET_QUARANTINE_BUCKET is required}
      ASSET_PRIVATE_BUCKET: ${ASSET_PRIVATE_BUCKET:?ASSET_PRIVATE_BUCKET is required}
      ASSET_CLAMAV_HOST: clamav
      ASSET_CLAMAV_PORT: "3310"
      ASSET_FFMPEG_PATH: /opt/ffmpeg/bin/ffmpeg
      ASSET_FFPROBE_PATH: /opt/ffmpeg/bin/ffprobe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - lms_internal
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout=2 2>/dev/null | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=6g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./apps/api/.local/observability:/var/log/lms:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    expose:
      - "8889"
    networks:
      - lms_internal
    depends_on:
      - jaeger
      - loki
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alert-rules.yaml:/etc/prometheus/alert-rules.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - lms_internal
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4317"
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "/cmd/jaeger/jaeger-linux", "version"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - lms_internal
    depends_on:
      - prometheus
      - jaeger
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  lms_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  livekit_recordings:
  localstack_data:
  clamav_definitions:
  prometheus_data:
  loki_data:
  grafana_data:
