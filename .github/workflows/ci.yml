name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      DJANGO_INTERNAL_ORIGIN: http://127.0.0.1:8000
      AUTH_SESSION_COOKIE_NAME: sessionid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.19'
      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Sync Python dependencies
        run: uv sync --locked --directory apps/api
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the locked Chromium browser for Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Start PostgreSQL and Redis from the project Compose configuration
        run: |
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Init
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Up
      - name: Initialize the local LTI verification key
        run: pnpm run mediacms:init
      - name: Backend checks
        run: |
          pnpm run api:check
          pnpm run api:database:check
          pnpm run api:check:production
          pnpm run api:migrations:check
          pnpm run api:migrations:plan
          pnpm run api:migrate
          pnpm run api:test:migrations
          pnpm run async:build
          pnpm run async:up
          pnpm run async:status
          pnpm run async:smoke
          pnpm run storage:validate
          pnpm run storage:init
          pnpm run storage:status
          pnpm run storage:smoke
          pnpm run media:build
          pnpm run media:up
          pnpm run media:status
          pnpm run media:smoke
          pnpm run observability:validate
          pnpm run observability:up
          pnpm run observability:status
          pnpm run observability:smoke
          pnpm run observability:dashboards
          pnpm run observability:metrics
          pnpm run observability:traces
          pnpm run observability:logs
          pnpm run organizations:check
          pnpm run organizations:test:policies
          pnpm run organizations:test:concurrency
          pnpm run organizations:test
          pnpm run catalog:check
          pnpm run catalog:migrations
          pnpm run catalog:test
          pnpm run catalog:test:tree
          pnpm run catalog:test:graphs
          pnpm run catalog:test:concurrency
          pnpm run courses:check
          pnpm run courses:migrations
          pnpm run courses:test:models
          pnpm run courses:test:ordering
          pnpm run courses:test:workflow
          pnpm run courses:test:concurrency
          pnpm run courses:test:api
          pnpm run courses:test
          pnpm run content:check
          pnpm run content:migrations
          pnpm run content:schema
          pnpm run content:test:versioning
          pnpm run content:test:readiness
          pnpm run content:test:security
          pnpm run content:test
          pnpm run content:schema:api
          pnpm run assets:check
          pnpm run assets:migrations
          pnpm run assets:test:uploads
          pnpm run assets:test:security
          pnpm run assets:test:processing
          pnpm run assets:test:content
          pnpm run assets:test:publishing
          pnpm run assets:test:access
          pnpm run assets:test:concurrency
          pnpm run assets:test
          pnpm run assets:schema
          pnpm run assets:client:check
          pnpm run organizations:demo
          pnpm run assets:smoke
          pnpm run publishing:check
          pnpm run publishing:migrations
          pnpm run publishing:schema
          pnpm run publishing:test:concurrency
          pnpm run publishing:test:api
          pnpm run publishing:test
          pnpm run learning:check
          pnpm run learning:migrations
          pnpm run learning:test
          pnpm run learning:test:concurrency
          pnpm run learning:test:security
          pnpm run assessments:check
          pnpm run assessments:migrations
          pnpm run assessments:test:partial-credit
          pnpm run assessments:test:math
          pnpm run assessments:test:pools
          pnpm run assessments:test:grade-versions
          pnpm run assessments:test:regrading
          pnpm run assessments:test:gradebook
          pnpm run assessments:test:analytics
          pnpm run assessments:test:worker
          pnpm run assessments:test
          pnpm run assessments:test:concurrency
          pnpm run assessments:test:security
          pnpm run events:check
          pnpm run events:migrations
          pnpm run events:test
          pnpm run events:smoke
          pnpm run discovery:check
          pnpm run discovery:migrations
          pnpm run discovery:test
          pnpm run discovery:smoke
          pnpm run notifications:check
          pnpm run notifications:migrations
          pnpm run notifications:test
          pnpm run notifications:email-smoke
          pnpm run events:operational-check
          pnpm run auth:check
          pnpm run auth:spec
          pnpm run auth:test
          pnpm run auth:test:security
          pnpm run auth:test:email
          pnpm run auth:test:rate-limits
          pnpm run api:format:check
          pnpm run api:lint
          pnpm run api:typecheck
          pnpm run api:test
          pnpm run api:health
          uv run --directory apps/api pip-audit
      - name: Frontend checks
        run: |
          pnpm run content:types:check
          pnpm run content:test:math
          pnpm run content:test:editor
          pnpm run web:lint
          pnpm run web:format:check
          pnpm run web:typecheck
          pnpm run web:test
          pnpm run web:build
          pnpm run auth:web:client:check
          pnpm run platform:client:check
          pnpm run catalog:client:check
          pnpm run courses:client:check
          pnpm run content:client:check
          pnpm run publishing:types:check
          pnpm run publishing:client:check
          pnpm run learning:client:check
          pnpm run assessments:types:check
          pnpm run assessments:client:check
          pnpm audit --prod
          pnpm run auth:web:test:e2e
          pnpm run catalog:e2e
          pnpm run courses:e2e
          pnpm run content:e2e
          pnpm run publishing:e2e
          pnpm run learning:e2e
          pnpm run assessments:e2e
          pnpm run assessments:advanced-e2e
          pnpm run assets:e2e
          pnpm run assets:visual
          pnpm run discovery:e2e
      - name: Stop and clean academic media services
        if: always()
        shell: pwsh
        run: |
          try {
            pnpm run storage:reset-local
          } finally {
            pnpm run media:down
          }
      - name: Stop the asynchronous assessment worker
        if: always()
        run: pnpm run async:down
      - name: Stop the local observability stack
        if: always()
        run: pnpm run observability:down
      - name: Remove schema-test infrastructure resources
        if: always()
        run: pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Reset -ConfirmReset
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.19'
      - name: Sync Python dependencies for the Django connection smoke
        run: uv sync --locked --directory apps/api
      - name: Initialize and validate local infrastructure
        run: |
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Init
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Validate
      - name: Pull locked images and start services
        run: |
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Pull
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Lock
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Up
      - name: Smoke persistence and authentication
        run: |
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Status
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Smoke
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Restart
          pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Smoke
      - name: Remove CI infrastructure resources
        if: always()
        run: pwsh -NoProfile -File scripts/infrastructure.ps1 -Action Reset -ConfirmReset
