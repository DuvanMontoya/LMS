[project]
name = "lms-api"
version = "0.1.0"
description = "LMS Django API"
requires-python = ">=3.13.13"
dependencies = [
    "boto3==1.43.61",
    "celery[redis]==5.6.3",
    "cryptography==49.0.0",
    "django-allauth[headless-spec]==65.18.0",
    "django-filter==26.1",
    "django-treebeard==6.0.0",
    "django[argon2]==6.0.7",
    "djangorestframework==3.17.1",
    "drf-spectacular[sidecar]==0.30.0",
    "jsonschema==4.26.0",
    "livekit-api==1.2.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.4",
    "pypdf==6.14.2",
    "python-dateutil==2.9.0.post0",
    "redis==6.4.0",
    "sentry-sdk==2.66.1",
    "structlog==26.1.0",
    "sympy==1.14.0",
]

[dependency-groups]
dev = [
    "django-stubs==6.0.7",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "pytest-django==4.12.0",
    "ruff==0.16.0",
]
docs = [
    "zensical==0.0.51",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "domain", "config"]
addopts = "--strict-config --strict-markers --cov=config --cov=domain --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*"]
source = ["config", "domain"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "DJ"]
